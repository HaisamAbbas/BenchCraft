name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Update installer
        run: python -m pip install --upgrade "pip>=26.2.1,<27"

      - name: Install project with dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Audit locked core and development dependencies
        run: python -m pip_audit --requirement requirements-dev.lock.txt --no-deps --disable-pip --strict

      - name: Audit installed core and development dependencies
        shell: bash
        run: |
          CORE_REQUIREMENTS=$(mktemp)
          trap 'rm -f "$CORE_REQUIREMENTS"' EXIT
          python -m pip freeze --all --exclude-editable > "$CORE_REQUIREMENTS"
          python -m pip_audit --requirement "$CORE_REQUIREMENTS" --no-deps --strict

      - name: Lint (ruff)
        run: python -m ruff check src tests plugins

      - name: Type check (mypy)
        run: python -m mypy src

      - name: Tests (pytest)
        run: python -m pytest -q

      - name: CLI smoke
        run: python -m aibench --help

      - name: Build sdist/wheel
        run: |
          python -m pip install build
          python -m build

  deepeval-plugin:
    # Real-package DeepEval adapter tests in the plugin's own environment (Prompt 05).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update installer
        run: python -m pip install --upgrade "pip>=26.2.1,<27"

      - name: Install core with dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Create the DeepEval plugin environment
        shell: bash
        run: |
          python -m venv plugins/deepeval/.venv
          if [ -f plugins/deepeval/.venv/Scripts/python.exe ]; then
            PLUGIN_PY=plugins/deepeval/.venv/Scripts/python.exe
          else
            PLUGIN_PY=plugins/deepeval/.venv/bin/python
          fi
          "$PLUGIN_PY" -m pip install --upgrade --disable-pip-version-check 'pip>=26.2.1,<27'
          "$PLUGIN_PY" -m pip install -e . -e plugins/deepeval
          # The test default resolves the native repository path. Avoid writing
          # an MSYS `/d/...` path into GITHUB_ENV on Windows, which Windows
          # Python cannot open and could silently skip the real contract suite.

      - name: Audit DeepEval plugin environment
        shell: bash
        run: |
          if [ -f plugins/deepeval/.venv/Scripts/python.exe ]; then
            PLUGIN_PY=plugins/deepeval/.venv/Scripts/python.exe
          else
            PLUGIN_PY=plugins/deepeval/.venv/bin/python
          fi
          PLUGIN_REQUIREMENTS=$(mktemp)
          trap 'rm -f "$PLUGIN_REQUIREMENTS"' EXIT
          "$PLUGIN_PY" -m pip freeze --all --exclude-editable > "$PLUGIN_REQUIREMENTS"
          python -m pip_audit --requirement "$PLUGIN_REQUIREMENTS" --no-deps --strict

      - name: Worker and DeepEval adapter tests (real package, deterministic judge)
        run: python -m pytest -q -rs tests/test_worker_evaluator.py tests/test_deepeval_adapter.py

  ragas-plugin:
    # Real-package Ragas adapter tests in an independent environment (Prompt 14).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update installer
        run: python -m pip install --upgrade "pip>=26.2.1,<27"

      - name: Install core with dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Create the Ragas plugin environment
        shell: bash
        run: |
          python -m venv plugins/ragas/.venv
          if [ -f plugins/ragas/.venv/Scripts/python.exe ]; then
            PLUGIN_PY=plugins/ragas/.venv/Scripts/python.exe
          else
            PLUGIN_PY=plugins/ragas/.venv/bin/python
          fi
          "$PLUGIN_PY" -m pip install --upgrade --disable-pip-version-check 'pip>=26.2.1,<27'
          "$PLUGIN_PY" -m pip install -e . -e plugins/ragas
          # The test default resolves the native repository path. Avoid writing
          # an MSYS `/d/...` path into GITHUB_ENV on Windows, which Windows
          # Python cannot open and could silently skip the real contract suite.
          python -m venv plugins/deepeval/.venv
          if [ -f plugins/deepeval/.venv/Scripts/python.exe ]; then
            DEEPEVAL_PY=plugins/deepeval/.venv/Scripts/python.exe
          else
            DEEPEVAL_PY=plugins/deepeval/.venv/bin/python
          fi
          "$DEEPEVAL_PY" -m pip install -e . -e plugins/deepeval

      - name: Audit Ragas plugin environment
        shell: bash
        run: |
          if [ -f plugins/ragas/.venv/Scripts/python.exe ]; then
            PLUGIN_PY=plugins/ragas/.venv/Scripts/python.exe
          else
            PLUGIN_PY=plugins/ragas/.venv/bin/python
          fi
          PLUGIN_REQUIREMENTS=$(mktemp)
          trap 'rm -f "$PLUGIN_REQUIREMENTS"' EXIT
          "$PLUGIN_PY" -m pip freeze --all --exclude-editable > "$PLUGIN_REQUIREMENTS"
          # These two unpatched package advisories are narrowly scoped; see plugins/ragas/SECURITY.md.
          python -m pip_audit --requirement "$PLUGIN_REQUIREMENTS" --no-deps --strict \
            --ignore-vuln GHSA-95ww-475f-pr4f \
            --ignore-vuln GHSA-w8v5-vhqr-4h9v

      - name: Worker, Ragas adapter, and same-output cross-ecosystem tests
        run: >-
          python -m pytest -q -rs tests/test_worker_evaluator.py
          tests/test_ragas_adapter.py tests/test_cross_ecosystem.py

  release-check:
    # Build the release artifacts and run the documented demo from the installed wheel in a
    # clean environment (13-T2, 13-G1). Dependencies come from the package index.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build, install from the wheel, run the quickstart and acceptance workflow
        shell: bash
        run: |
          python -m pip install build
          python scripts/release_check.py --out "$RUNNER_TEMP/release-check"

      - name: Built evaluator plugin contract checks (Prompt 14)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        # The contract tests run from this checkout with this interpreter: it needs pytest
        # and the core's test dependencies (the plugin itself installs in a clean venv).
        run: |
          python -m pip install -e ".[dev]"
          python scripts/release_check.py --out "$RUNNER_TEMP/plugin-release-check" --plugin --no-acceptance

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-check-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/release-check/release-check.json
            ${{ runner.temp }}/release-check/logs/
            ${{ runner.temp }}/release-check/dist/
