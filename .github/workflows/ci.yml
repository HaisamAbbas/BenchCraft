name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project with dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: python -m ruff check src tests

      - name: Type check (mypy)
        run: python -m mypy src

      - name: Tests (pytest)
        run: python -m pytest -q

      - name: CLI smoke
        run: python -m aibench --help

      - name: Build sdist/wheel
        run: |
          python -m pip install build
          python -m build

  deepeval-plugin:
    # Real-package DeepEval adapter tests in the plugin's own environment (Prompt 05).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install core with dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Create the DeepEval plugin environment
        shell: bash
        run: |
          python -m venv plugins/deepeval/.venv
          if [ -f plugins/deepeval/.venv/Scripts/python.exe ]; then
            PLUGIN_PY=plugins/deepeval/.venv/Scripts/python.exe
          else
            PLUGIN_PY=plugins/deepeval/.venv/bin/python
          fi
          "$PLUGIN_PY" -m pip install -e . -e plugins/deepeval
          echo "AIBENCH_DEEPEVAL_PYTHON=$PWD/$PLUGIN_PY" >> "$GITHUB_ENV"

      - name: Worker and DeepEval adapter tests (real package, deterministic judge)
        run: python -m pytest -q -rs tests/test_worker_evaluator.py tests/test_deepeval_adapter.py
