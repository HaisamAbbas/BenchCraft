[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aibench"
# The single source of the version is `aibench.__version__`.
dynamic = ["version"]
description = "Conversational CLI for AI application benchmarking"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.6,<3",
    "typer>=0.12,<1",
    "rich>=13.7,<14",
    "httpx>=0.28.1,<0.29",
    "jsonschema>=4.23,<5",
    # Interactive input (§20): async prompt, multiline, history, completion. Tested: 3.0.53.
    "prompt_toolkit>=3.0.43,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.9",
    "ruff>=0.4",
    "pip-audit>=2.9,<3",
    # Real pseudo-console (ConPTY) tests of the interactive terminal on Windows.
    "pywinpty>=2.0; sys_platform == 'win32'",
]

[project.scripts]
benchcraft = "aibench.cli.main:run"
aibench = "aibench.cli.main:run"

[tool.setuptools.dynamic]
version = {attr = "aibench.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# `aibench init` copies these into a new project (11-T4).
"aibench.quickstart" = ["files/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.mypy]
python_version = "3.11"
packages = ["aibench"]
ignore_missing_imports = true
