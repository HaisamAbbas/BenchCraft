[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aibench-ragas"
# The single source of the version is `aibench_ragas._version.__version__`.
dynamic = ["version"]
description = "Ragas faithfulness metrics for aibench, run in an isolated plugin environment"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
dependencies = [
    "aibench>=0.1.0rc1,<0.2",
    # Exact pin: the adapter's field and response-model contract was checked against
    # this release (see aibench_ragas.faithfulness.PINNED_RAGAS).
    "ragas==0.4.3",
    # Ragas 0.4.3 imports the pre-0.4 community layout.  Keep the transitive
    # API surface tested with the pinned Ragas release from drifting into an
    # incompatible major release.
    "langchain-community>=0.3.27,<0.4",
    # Instructor 1.17 is the first pinned API line in this adapter contract that supports
    # the OpenAI SDK 2.x required by the patched langchain-openai release.
    "instructor>=1.17.0,<1.18",
    # CVE-2026-41488 is fixed in 1.1.14; keep the compatible 1.1 API family.
    "langchain-openai>=1.1.14,<1.2",
    # Ragas pulls both transitively; keep them at the reviewed security floors.
    "langgraph-sdk>=0.4.6,<0.5",
    "marshmallow>=3.26.2,<4",
    # langchain-openai 1.1.14+ requires OpenAI SDK 2.26; the adapter's llm_factory path
    # is contract-tested against the v2 client API.
    "openai>=2.26,<3",
]

[project.entry-points."aibench.evaluators"]
ragas = "aibench_ragas:EVALUATORS"

[tool.setuptools.dynamic]
version = {attr = "aibench_ragas._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
